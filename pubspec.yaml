name: bd_cricket_scorer
description: BD Cricket Scorer - cricket tournament and live scoring
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/bd_cricket_icon.png"
  adaptive_icon_background: "#07110D"
  adaptive_icon_foreground: "assets/bd_cricket_icon.png"
  min_sdk_android: 21
